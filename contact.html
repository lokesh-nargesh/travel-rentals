<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Contact Us</h1>
    <nav id="navbar">
      <a href="index.html">Home</a>
      <a href="blogs.html">Blogs</a>
      <a href="cars.html">Cars</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <section class="contact">
    <h2>We’d Love to Hear from You!</h2>
    <p>Send us a message or chat directly via WhatsApp for instant booking.</p>

    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="email" id="email" placeholder="Your Email" required>
      <textarea id="message" rows="4" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>

    <a href="https://wa.me/9111442103?text=Hi!%20I%20want%20to%20book%20a%20car."
       class="book-btn" target="_blank">Chat on WhatsApp</a>
  </section>

  <footer>
    <p>© 2025 Travel Rentals | Designed by Lokesh</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
